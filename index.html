  </main>

  <!-- CV overlay. The CV link above is a plain link to resume.pdf; the script
       below upgrades it to this dialog only where an embedded PDF renders well. -->
  <dialog class="cv-dialog" id="cv-dialog" aria-labelledby="cv-dialog-title" tabindex="-1">
    <div class="cv-dialog__bar">
      <h2 class="cv-dialog__title" id="cv-dialog-title">CV</h2>
      <a class="cv-dialog__open" href="resume.pdf" target="_blank" rel="noopener">Open the PDF</a>
      <button type="button" class="cv-dialog__close" data-cv-close aria-label="Close CV">Close</button>
    </div>
    <!-- tabindex="-1" keeps the frame out of the Tab order: the browser's PDF
         viewer swallows keystrokes once it has focus, Esc included. Keyboard
         users get the full viewer through "Open the PDF" instead. toolbar=0
         hides Chromium's viewer toolbar (page number, zoom, search) so nothing
         inside the frame needs sustained focus; Firefox and Safari ignore it. -->
    <iframe class="cv-dialog__frame" title="Dean Hicks CV (PDF)" data-src="resume.pdf#toolbar=0&view=FitH" tabindex="-1"></iframe>
  </dialog>

  <script>
  (function () {
    var dialog = document.getElementById('cv-dialog');
    var link = document.querySelector('[data-cv-open]');
    if (!dialog || !link || typeof dialog.showModal !== 'function') return;
    var frame = dialog.querySelector('iframe');
    var closeButton = dialog.querySelector('[data-cv-close]');
    var opener = null;

    function canEmbed() {
      // Phones and tablets get the PDF itself: their inline viewers show one
      // page in a box you cannot scroll.
      if (!window.matchMedia('(min-width: 48em) and (hover: hover) and (pointer: fine)').matches) return false;
      // A desktop browser with no inline PDF viewer would show a blank frame
      // or a download prompt inside the dialog.
      if (navigator.pdfViewerEnabled === false) return false;
      return true;
    }

    link.addEventListener('click', function (event) {
      // Modified clicks keep their native meaning (new tab, download).
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      if (!canEmbed()) return;
      event.preventDefault();
      opener = link;
      if (!frame.getAttribute('src')) frame.setAttribute('src', frame.getAttribute('data-src'));
      dialog.showModal();
    });

    closeButton.addEventListener('click', function () { dialog.close(); });

    // Fires for the button, Esc and anything else that closes the dialog.
    dialog.addEventListener('close', function () {
      if (opener) { opener.focus(); opener = null; }
    });

    // A mouse click inside the PDF still moves focus into the frame, and the
    // viewer keeps Esc for itself from then on. In Chromium the frame's
    // toolbar is hidden (toolbar=0 above), so nothing in it needs focus and
    // we can hand focus straight back to the dialog; wheel, drag and text
    // selection follow the pointer and are unaffected. Firefox and Safari
    // keep their toolbar, whose page-number and search fields need focus to
    // type into, so there the frame keeps focus and Esc closes the dialog
    // only while focus is outside the PDF. navigator.userAgentData exists in
    // Chromium browsers only, which is exactly the set that honours toolbar=0.
    var toolbarHidden = 'userAgentData' in navigator;
    window.addEventListener('blur', function () {
      if (toolbarHidden && dialog.open && document.activeElement === frame) {
        setTimeout(function () { if (dialog.open) dialog.focus(); }, 0);
      }
    });

    // showModal() already makes the rest of the page inert; this stops Tab
    // from leaving the dialog for the browser chrome at either end.
    dialog.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab') return;
      var items = dialog.querySelectorAll('a[href], button:not([disabled])');
      var first = items[0], last = items[items.length - 1];
      var active = document.activeElement;
      if (event.shiftKey && (active === first || active === dialog)) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && active === last) {
        event.preventDefault(); first.focus();
      }
    });
  })();
  </script>
